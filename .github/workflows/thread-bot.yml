name: Thread Bot Daily Runner

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thread-bot-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Run Thread Bot
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TOTAL_POSTS: ${{ vars.TOTAL_POSTS }}
          IMAGE_POST_COUNT: ${{ vars.IMAGE_POST_COUNT }}
        run: |
          python bot.py

      # The report is now a first-class output. Email is optional and non-fatal,
      # so a Gmail authentication problem cannot destroy a successful run.
      - name: Upload generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thread-bot-report-${{ github.run_number }}
          path: |
            state/latest_threads.txt
            state/history.json
          if-no-files-found: warn
          retention-days: 14

      # Commit topic/article history only when the bot reached the successful
      # state-save path. [skip ci] prevents this commit from triggering itself.
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update bot history [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
