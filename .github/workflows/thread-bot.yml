name: Thread Bot Daily Runner

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thread-bot-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Thread Bot
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOTAL_POSTS: ${{ vars.TOTAL_POSTS }}
          IMAGE_POST_COUNT: ${{ vars.IMAGE_POST_COUNT }}
          ENABLE_LLM_SCORING: ${{ vars.ENABLE_LLM_SCORING }}
          HF_IMAGE_MODEL: ${{ vars.HF_IMAGE_MODEL }}
        run: python bot.py

      - name: Upload generated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-bot-report-${{ github.run_number }}
          path: |
            state/latest_threads.txt
            state/latest_sources.txt
            state/history.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update bot history [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
