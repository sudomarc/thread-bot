name: Thread Bot Weekly Strategy

on:
  push:
    branches:
      - main
  schedule:
    # All times are UTC/GMT and match the 30-day Threads strategy.
    - cron: '0 14 * * 3' # Wednesday 14:00
    - cron: '0 18 * * 5' # Friday 18:00
    - cron: '0 13 * * 6' # Saturday 13:00
    - cron: '0 16 * * 0' # Sunday 16:00
    - cron: '0 18 * * 1' # Monday 18:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thread-bot-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  TOTAL_POSTS: '1'
  IMAGE_POST_COUNT: '0'

jobs:
  build:
    # Include [run-bot] in a main commit message to launch an immediate strategy run.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Thread Bot strategy slot
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_IMAGE_MODEL: ${{ vars.HF_IMAGE_MODEL }}
        run: python strategy_runner.py

      - name: Upload generated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-bot-report-${{ github.run_number }}
          path: |
            state/latest_threads.txt
            state/latest_sources.txt
            state/latest_content_evaluation.txt
            state/history.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update bot strategy state [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
